services:
  postgres:
    image: postgres:17
    container_name: interim-postgres
    environment:
      POSTGRES_USER: interim
      POSTGRES_PASSWORD: interim_dev_password
      POSTGRES_DB: interim_dev
    ports:
      - "55432:5432"
    volumes:
      - interim_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interim -d interim_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  interim_postgres_data:
